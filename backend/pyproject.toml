# The Plans backend's own environment: the runtime dependencies plans_backend.py
# imports, and the toolchain that packages it (scripts/build-backend.mjs),
# pinned independently of the Navide repository's backend.
[project]
name = "navide-plans-backend"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "navide-plugin-sdk>=1.0.0,<2",
    "pyyaml==6.0.3",
]

[dependency-groups]
build = ["pyinstaller==6.22.3"]
test = ["pytest==9.2.0"]

[tool.uv]
package = false
default-groups = ["build"]

[tool.uv.sources]
navide-plugin-sdk = { url = "https://github.com/Navide-dev/Navide/releases/download/plugin-packages-1.0.0/navide_plugin_sdk-1.0.0-py3-none-any.whl" }
