# Packaging workflow (enabled 2026-11-21 with the user's approval).
#
# Builds, tests and packs navide.plans for every target the App ships: the
# five Navide's release.yml builds and its publish script accepts (no Intel
# macOS App, so no darwin-x64).
# PyInstaller builds only for the host it runs on, so each target has its own
# runner. The backend is packaged from this repository's own Python
# environment (backend/pyproject.toml, backend/uv.lock, backend/.python-version):
# navide_plugin_sdk and PyYAML (pure Python or binary wheels on every target),
# pinned with their hashes.
# Publishing stays on the release machine, where the publisher key lives
# (Navide's scripts/publish-first-party-plugins.sh --package): CI never sees it.
name: navide.plans

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Build navide.plans (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-15 }
          - { target: linux-x64, runner: ubuntu-22.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: win32-x64, runner: windows-latest }
          - { target: win32-arm64, runner: windows-11-arm }
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          cache-suffix: navide-plans-${{ matrix.target }}
      - name: Install locked dependencies
        run: |
          npm ci
          uv --project backend sync --locked
      - name: Check the runner is the target
        run: |
          host="$(node -p "process.platform + '-' + process.arch")"
          echo "runner target: ${host}"
          test "${host}" = "${{ matrix.target }}"
      - name: Typecheck and test
        run: |
          npm run typecheck
          npm test
          npm run test:backend
      - name: Build, validate and pack
        id: pack
        run: |
          npm run build
          npm run check
          version="$(node -p "require('./manifest.json').version")"
          name="navide.plans-${version}-${{ matrix.target }}.vsix"
          npm run package
          mv navide-plans.vsix "${name}"
          node -e 'const fs=require("node:fs"),c=require("node:crypto");const f=process.argv[1];fs.writeFileSync(f+".sha256",c.createHash("sha256").update(fs.readFileSync(f)).digest("hex")+"  "+f+"\n")' "${name}"
          cat "${name}.sha256"
          echo "name=${name}" >> "${GITHUB_OUTPUT}"
      - name: Dry-run sign and verify with a throwaway key
        run: |
          keys="${RUNNER_TEMP}/navide-plans-throwaway-key"
          trap 'rm -rf "${keys}"' EXIT
          sdk=node_modules/@navide/plugin-sdk/bin/navide-plugin.mjs
          node "${sdk}" keygen --out-dir "${keys}" --name throwaway
          node "${sdk}" sign "${{ steps.pack.outputs.name }}" --key "${keys}/throwaway.key" --out "${keys}/package.sig"
          node "${sdk}" verify "${{ steps.pack.outputs.name }}" --key "${keys}/throwaway.pub" --signature "${keys}/package.sig"
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            ${{ steps.pack.outputs.name }}
            ${{ steps.pack.outputs.name }}.sha256
          if-no-files-found: error
          retention-days: 7
